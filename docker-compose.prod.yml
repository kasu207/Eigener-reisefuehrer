# Produktions-Setup für einen einzelnen Server (z. B. Hetzner):
#   docker compose -f docker-compose.prod.yml up -d --build
# Konfiguration kommt aus der .env im selben Verzeichnis (siehe DEPLOY.md).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: reisefuehrer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: reisefuehrer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reisefuehrer"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://reisefuehrer:${POSTGRES_PASSWORD}@db:5432/reisefuehrer
      APP_URL: ${APP_URL:?APP_URL in .env setzen}
      # PDF-Rendering ruft die eigene App container-intern auf
      PDF_INTERNAL_URL: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      AI_MODE: ${AI_MODE:-live}
      # Optionale Bildquellen (leer = deaktiviert; Wikimedia + Openverse gehen ohne Key)
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      EUROPEANA_API_KEY: ${EUROPEANA_API_KEY:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD in .env setzen}
      # Impressum (§ 5 DDG). Ohne diese Angaben bleibt /impressum leer und
      # /admin/startklar meldet dauerhaft einen Blocker.
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_STREET: ${OPERATOR_STREET:-}
      OPERATOR_CITY: ${OPERATOR_CITY:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_VAT_ID: ${OPERATOR_VAT_ID:-}
      OPERATOR_RESPONSIBLE: ${OPERATOR_RESPONSIBLE:-}
      OPERATOR_PHONE: ${OPERATOR_PHONE:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      DATA_RETENTION_MONTHS: ${DATA_RETENTION_MONTHS:-12}
    # Schema anwenden, dann starten
    command: sh -c "npx prisma db push --skip-generate && npm start"
    ports:
      # APP_BIND in der .env steuert Host-Port/Interface, z. B.:
      #   APP_BIND=80                -> öffentlich auf Port 80 (Standard)
      #   APP_BIND=8082              -> öffentlich auf Port 8082
      #   APP_BIND=127.0.0.1:8082    -> nur lokal, für Reverse-Proxy (Caddy/nginx)
      - "${APP_BIND:-80}:3000"

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://reisefuehrer:${POSTGRES_PASSWORD}@db:5432/reisefuehrer
      APP_URL: ${APP_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      AI_MODE: ${AI_MODE:-live}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      DATA_RETENTION_MONTHS: ${DATA_RETENTION_MONTHS:-12}
    command: npm run worker

volumes:
  pgdata:
