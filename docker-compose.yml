services:
  db:
    # Postgres 16 mit pgvector-Extension (semantische Suche Wissensdatenbank).
    # Bestehendes Datenvolume bleibt kompatibel – einfach neu starten.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reisefuehrer
      POSTGRES_PASSWORD: reisefuehrer
      POSTGRES_DB: reisefuehrer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
